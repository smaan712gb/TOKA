[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toka"
version = "0.7.0"
description = "Measure where an AI agent's token spend actually goes."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Toka contributors" }]
keywords = ["llm", "agents", "tokens", "cost", "prompt-cache", "context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
# No runtime dependencies. Reads local files, talks to nothing.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
toka = "toka.cli:main"

[project.urls]
Homepage = "https://github.com/smaan712gb/TOKA"
Issues = "https://github.com/smaan712gb/TOKA/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/toka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
