[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokameter"
version = "0.14.0"
description = "Measure where an AI agent's token spend actually goes."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Toka contributors" }]
keywords = ["llm", "agents", "tokens", "cost", "prompt-cache", "context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    # Pure Python, no compiled parts, no platform-specific paths that are
    # not resolved at runtime — and now tested on all three in CI.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# No runtime dependencies. Reads local files, talks to nothing.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "tomli>=2.0; python_version<'3.11'"]

[project.scripts]
toka = "toka.cli:main"

[project.urls]
Homepage = "https://github.com/smaan712gb/TOKA"
Issues = "https://github.com/smaan712gb/TOKA/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/toka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
