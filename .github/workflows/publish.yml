name: publish

# Publishes to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing, so there is no API token in this repo and
# none in its secrets — GitHub proves the workflow's identity to PyPI
# directly. A token stored in a repository is a credential that outlives
# the person who added it; this cannot be copied out and reused.
#
# One-time setup, at https://pypi.org/manage/account/publishing/:
#
#   PyPI project name   tokameter
#   Owner               smaan712gb
#   Repository name     TOKA
#   Workflow name       publish.yml
#   Environment name    pypi
#
# For the very first release the project does not exist on PyPI yet, so
# add it there as a "pending publisher" — same form, before any upload.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip build twine
      - run: pip install -e ".[dev]"

      # Nothing ships that does not pass. A release is the worst possible
      # place to discover a broken test.
      - run: pytest -q

      - run: python -m build
      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
